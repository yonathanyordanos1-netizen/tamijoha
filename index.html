  <script>
    // Prevent theme flash — set data-theme before page renders
    (function() {
      try {
        var theme = localStorage.getItem('zoe-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch(e) {}
    })();
  </script>
