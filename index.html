<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tamijoha Men's Studio - Premium men's grooming in Addis Ababa. Custom cuts, hair colouring, scalp treatments, and in-home barber services." />
    <meta name="keywords" content="barber, barbershop, men's grooming, haircut, Addis Ababa, Tamijoha, men's studio, hair colouring, scalp treatment" />
    <meta property="og:title" content="Tamijoha Men's Studio | Premium Men's Grooming" />
    <meta property="og:description" content="Addis Ababa's finest barber shop. Precision cuts, colour, and grooming services." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tamijoha.com" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Tamijoha Men's Studio | Premium Men's Grooming - Addis Ababa</title>
  <script>
    // Prevent theme flash — set data-theme before page renders
    (function() {
      try {
        var theme = localStorage.getItem('tamijoha-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch(e) {}
    })();
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
